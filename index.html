<style>
  :root { --bg:#f5f3ee; --card:#fff; --ink:#1c1c1e; --mute:#6e6e73; --line:#e3e0d8; --accent:#2f6f5e; --soft:#e7f1ed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151516; --card:#1e1e20; --ink:#f2f2f2; --mute:#a1a1a6; --line:#323235; --accent:#74c7ad; --soft:#1f302b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:680px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:24px; margin:0 0 2px; }
  .sub { color:var(--mute); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 14px; }
  .title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .zh { font-size:18px; font-weight:700; }
  .en { color:var(--mute); font-size:14px; }
  summary { cursor:pointer; color:var(--mute); font-size:13px; margin-top:4px; }
  pre { white-space:pre-wrap; word-break:break-word; font:14px/1.7 inherit; color:var(--mute); margin:8px 0 0; max-height:220px; overflow:auto; }
  .track { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .letter { flex:none; width:32px; height:32px; border-radius:50%; background:var(--soft); color:var(--accent); font-weight:700; display:flex; align-items:center; justify-content:center; }
  .who { flex:none; font-size:13px; color:var(--accent); font-weight:600; display:none; }
  .revealed .who { display:block; }
  audio { flex:1; min-width:0; height:40px; }
  .pick { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .pick label { border:1px solid var(--line); border-radius:999px; padding:5px 14px; font-size:14px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .pick input { position:absolute; opacity:0; pointer-events:none; }
  .pick label:has(input:checked) { border-color:var(--accent); background:var(--soft); color:var(--accent); font-weight:600; }
  .buttons { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px; }
  button { font:inherit; font-size:15px; border-radius:999px; padding:8px 22px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  button.main { background:var(--accent); color:#fff; }
</style>

  <div id="list"></div>

y alive tryna keep my stride\nWorld's so heavy but I won't collide\nTryna stay alive ain't got no guide\nJust me and the beat and the fire inside\n\n[Bridge]\nSidewalk cracks spell out my name\nEach step forward plays a dangerous game\nThe grind won't stop it's all I claim\nBut this life this life it ain't tame", "tracks": [{"letter": "A", "src": "audio/s4-a.m4a"}, {"letter": "B", "src": "audio/s4-b.m4a"}]}, {"n": 5, "zh": "重金属抒情", "en": "Heavy Metal Ballad", "lyrics": "[Intro]\n\n[Verse 1]\n                    \nWe light our hearts like cigarette flames\n                    \nBurning slow in forgotten names\n                   \nTrading truth for a moment’s delight\n                    \nWe are the fools of the night\n\n[Verse 2]\n                    \nWe dance in alleys the daylight denies\n                    \nChasing echoes and neon lies\n                   \nOur shadows stretch past wrong and right\n                    \nWe are the fools of the night\n\n[Chorus]\n                    \nAnd we know the stars won’t save us\n                    \nBut we still make a wish\n                    \nOn every broken sky\n                    \nWe live, we lose, we try\n                    \nAnd the night, it knows our names\n                    \nIt holds us in its light\n                    \nWe are the dreamers, the drifters\n                    \nWe are the fools of the night\n\n[Verse 3]\n                    \nWe write our stories on barroom walls\n                    \nIn lipstick, laughter, and late-night calls\n                   \nThe morning erases what felt so right\n                    \nBut we are the fools of the night\n\n[Outro]\n (let ring…)", "tracks": [{"letter": "A", "src": "audio/s5-a.m4a"}, {"letter": "B", "src": "audio/s5-b.m4a"}]}, {"n": 6, "zh": "木吉他慢歌", "en": "Acoustic Ballad", "lyrics": "[Verse 1]\n\nHe was a shadow in the sunrise,\nEyes like storms that never fade.\nHe spoke in whispers, soft and wordless,\nAnd every word he left me stayed.\n\n[V const ANSWER = {"s1-A": "ref", "s1-B": "new", "s2-A": "new", "s2-B": "ref", "s3-A": "new", "s3-B": "ref", "s4-A": "ref", "s4-B": "new", "s5-A": "ref", "s5-B": "new", "s6-A": "new", "s6-B": "ref"};
const NAMES = { new: "SGLang", ref: "官方" };
const list = document.getElementById("list");
const picks = {};
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
for (const song of SONGS) {
  const card = el("section", "card");
  const title = el("div", "title");
  title.append(el("span", "zh", song.zh), el("span", "en", song.en));
  card.append(title);
  const details = el("details");
  details.append(el("summary", "", "歌词"), el("pre", "", song.lyrics));
  card.append(details);
  for (const track of song.tracks) {
    const row = el("div", "track");
    const audio = el("audio");
    audio.controls = true; audio.preload = "none"; audio.src = track.src;
    audio.addEventListener("play", () => { for (const other of document.querySelectorAll("audio")) if (other !== audio) other.pause(); });
    row.append(el("span", "letter", track.letter), audio, el("span", "who", NAMES[ANSWER["s" + song.n + "-" + track.letter]]));
    card.append(row);
  }
  const pick = el("div", "pick");
  for (const option of ["A 更好", "B 更好", "差不多"]) {
    const label = el("label");
    const input = el("input");
    input.type = "radio"; input.name = "pick-" + song.n;
    input.addEventListener("change", () => { picks[song.n] = option; });
    label.append(input, document.createTextNode(option));
    pick.append(label);
  }
  card.append(pick);
  list.append(card);
}
document.getElementById("copy").addEventListener("click", async event => {
  const text = "YuE2 A/B：" + SONGS.map(song => song.zh + " " + (picks[song.n] || "没选")).join("；");
  try { await navigator.clipboard.writeText(text); event.target.textContent = "已复制 ✓"; }
  catch (error) { window.prompt("复制这段：", text); }
});
document.getElementById("reveal").addEventListener("click", event => {
  document.body.classList.add("revealed");
  event.target.remove();
});
</script>
